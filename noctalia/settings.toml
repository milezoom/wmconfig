config_version = 20

[bar.default]
center = []
end = [ "tray", "clipboard", "notifications", "network", "bluetooth", "volume", "clock", "battery", "session", "privacy" ]
margin_ends = 0
position = "right"
radius = 0
shadow = false
start = [ "launcher", "media", "taskbar" ]

[control_center.calendar]
show_events_card = false

[dock]
shadow = false

[hooks]
battery_percentage_changed = "/home/muslim/Projects/scripts/battery-notification.sh"
rebooting = "/home/muslim/Projects/scripts/before-shutdown.sh"
shutting_down = "/home/muslim/Projects/scripts/before-shutdown.sh"
theme_mode_changed = "/home/muslim/Projects/scripts/theme-change.sh"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
fingerprint = false
transition = [ "stripes" ]
transition_duration = 300

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 224.0
    box_width = 400.0
    cx = 960.0
    cy = 188.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        color = "primary"

[nightlight]
enabled = true

[osd]
offset_y = 64
position = "bottom_center"
position_vertical = "bottom_center"

[shell]
launch_apps_as_systemd_services = true
polkit_agent = true
popup_shadows = false
telemetry_enabled = true

    [shell.launcher]
    app_grid = true
    default_view = "all"

    [shell.panel]
    floating_layer = "top"
    session_placement = "floating"
    session_position = "center"
    shadow = false

    [shell.session]
    grid = true
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = false
        shortcut = "5"
        variant = "default"

    [shell.window_switcher]
    style = "icons"

[theme]
source = "wallpaper"

    [theme.templates]
    enable_builtin_templates = false
    enable_community_templates = false

[wallpaper.default]
path = "/home/muslim/Pictures/desktopwallpaper.jpg"

[wallpaper.last]
path = "/home/muslim/Pictures/desktopwallpaper.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/muslim/Pictures/desktopwallpaper.jpg"

[widget.battery]
display_mode = "graphic"
hide_when_plugged = true

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.privacy]
active_color = "error"
hide_inactive = true

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
inactive_opacity = 0.5
show_active_indicator = false
show_workspace_label = false

[widget.tray]
drawer = true

[widget.volume]
show_label = false